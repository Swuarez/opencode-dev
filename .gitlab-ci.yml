# Pushing a version tag (for example v2.41) creates the GitLab release.
# The job stops, and no release is made, when SHA256SUMS does not match the
# files or the launcher header does not carry the tag's version.
release:
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+$/'
  script:
    - apk add --no-cache curl
    - sha256sum -c SHA256SUMS
    - grep -q "^REM  OpenCode launcher  ($CI_COMMIT_TAG)" "OpenCode Infinite.bat"
    - |
      B="$CI_PROJECT_URL/-/raw/$CI_COMMIT_TAG"
      cat > rel.json <<EOF
      {"tag_name":"$CI_COMMIT_TAG","name":"$CI_COMMIT_TAG",
       "description":"OpenCode Infinite $CI_COMMIT_TAG. The launcher updates itself from the latest release and checks each file against SHA256SUMS.",
       "assets":{"links":[
        {"name":"OpenCode Infinite.bat","url":"$B/OpenCode%20Infinite.bat","direct_asset_path":"/OpenCode-Infinite.bat","link_type":"package"},
        {"name":"Update launcher.bat","url":"$B/Update%20launcher.bat","direct_asset_path":"/Update-launcher.bat","link_type":"package"},
        {"name":"opencode-infinite.sh","url":"$B/opencode-infinite.sh","direct_asset_path":"/opencode-infinite.sh","link_type":"package"},
        {"name":"SHA256SUMS","url":"$B/SHA256SUMS","direct_asset_path":"/SHA256SUMS","link_type":"other"}]}}
      EOF
      curl --fail-with-body -sS -X POST -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" --data @rel.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
